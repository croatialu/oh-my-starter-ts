catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - bumpp@12.0.0
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalog:
  '@ai-hero/sandcastle': ^0.12.0
  knip: ^6.32.2
  zod: ^4.4.3
catalogs:
  cli:
    '@antfu/eslint-config': ^9.2.0
    '@antfu/ni': ^30.3.0
    bumpp: ^12.0.0
    eslint: ^10.8.0
    nano-staged: ^1.0.2
    publint: ^0.3.22
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    tsx: ^4.23.1
    typescript: npm:@typescript/typescript6@~6.0.2
    typescript-7: npm:typescript@^7.0.2
    vite: ^8.1.5
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.2.0
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.1
allowBuilds:
  esbuild: true
  simple-git-hooks: true
